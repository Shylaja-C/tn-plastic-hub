<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <!-- Three-armed molecular body — blue gradient blobs -->
  <defs>
    <radialGradient id="blobGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#1B4F8A"/>
    </radialGradient>
    <radialGradient id="blobGrad2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#1B4F8A"/>
    </radialGradient>
  </defs>

  <!-- Left arm + blob -->
  <path d="M50 52 Q32 44 22 36 Q14 28 18 20 Q22 12 30 14 Q38 16 38 26 Q38 34 44 42 Z"
        fill="url(#blobGrad)"/>
  <!-- Left blob circle -->
  <circle cx="20" cy="17" r="10" fill="url(#blobGrad)"/>

  <!-- Right arm + blob -->
  <path d="M50 52 Q68 44 78 36 Q86 28 82 20 Q78 12 70 14 Q62 16 62 26 Q62 34 56 42 Z"
        fill="url(#blobGrad)"/>
  <!-- Right blob circle -->
  <circle cx="80" cy="17" r="10" fill="url(#blobGrad)"/>

  <!-- Bottom arm + blob -->
  <path d="M50 58 Q44 70 44 80 Q44 90 50 94 Q56 98 62 94 Q68 90 56 80 Q52 72 56 58 Z"
        fill="url(#blobGrad)"/>
  <!-- Bottom blob circle -->
  <circle cx="50" cy="96" r="10" fill="url(#blobGrad)"/>

  <!-- Center connector mass -->
  <ellipse cx="50" cy="52" rx="18" ry="16" fill="url(#blobGrad)"/>

  <!-- Recycling circle track (green) -->
  <circle cx="50" cy="50" r="13" fill="#5CB85C" opacity="0.9"/>
  <circle cx="50" cy="50" r="8" fill="white" opacity="0.92"/>

  <!-- Three recycling arrows (blue, rotated 120° each) -->
  <!-- Arrow 1 — top -->
  <g transform="rotate(0 50 50)">
    <path d="M50 37 L53 42 L47 42 Z" fill="#1B4F8A"/>
    <path d="M50 37 Q57 37 60 43" stroke="#1B4F8A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Arrow 2 — bottom-right -->
  <g transform="rotate(120 50 50)">
    <path d="M50 37 L53 42 L47 42 Z" fill="#1B4F8A"/>
    <path d="M50 37 Q57 37 60 43" stroke="#1B4F8A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Arrow 3 — bottom-left -->
  <g transform="rotate(240 50 50)">
    <path d="M50 37 L53 42 L47 42 Z" fill="#1B4F8A"/>
    <path d="M50 37 Q57 37 60 43" stroke="#1B4F8A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
